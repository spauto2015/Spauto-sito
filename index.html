<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S.P. AUTO | Il tuo usato sicuro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:#0b2945;background:#fff}
a{text-decoration:none;color:inherit}

/* BARRA SUPERIORE */
.top{
background:#082744;
color:white;
height:32px;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}
.top-inner{
width:1180px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
}
.top-left{display:flex;gap:32px}
.social{display:flex;gap:13px;font-weight:bold}

/* MENU */
nav{
height:66px;
background:#fff;
display:flex;
align-items:center;
padding:0 max(5%,calc((100% - 1180px)/2));
border-bottom:1px solid #ddd;
}
.brand{
font-size:28px;
font-weight:900;
font-style:italic;
white-space:nowrap;
color:#082744;
}
.brand:before{
content:"///";
color:#168fd1;
font-style:normal;
margin-right:7px;
letter-spacing:-5px;
}
.links{
margin-left:auto;
display:flex;
align-items:center;
gap:31px;
font-size:12px;
}
